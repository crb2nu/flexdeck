apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexdeck-public
  namespace: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
    app.kubernetes.io/component: public-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flexdeck-public-reader
  labels:
    app.kubernetes.io/name: flexdeck
    app.kubernetes.io/component: public-api
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flexdeck-public-reader
  labels:
    app.kubernetes.io/name: flexdeck
    app.kubernetes.io/component: public-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flexdeck-public-reader
subjects:
  - kind: ServiceAccount
    name: flexdeck-public
    namespace: flexdeck
