apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexdeck
  namespace: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
rules:
  # Core resources - read
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "configmaps", "secrets", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Core resources - write (for pod management)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Apps resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Batch resources
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flexdeck
subjects:
  - kind: ServiceAccount
    name: flexdeck
    namespace: flexdeck
