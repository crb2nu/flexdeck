apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexdeck
  namespace: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flexdeck
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexdeck
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: flexdeck
      nodeSelector:
        kubernetes.io/arch: amd64
        node.flexstack.io/class: services
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - cblevins-radeonvii
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.flexstack.io/pool
                    operator: In
                    values:
                      - services-core
      containers:
        - name: flexdeck
          image: registry.harbor.lan/library/flexdeck:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            # K8s - uses in-cluster config via service account
            - name: K8S_DISABLED
              value: "false"
            - name: K8S_READONLY
              value: "false"
            # Prometheus
            - name: PROM_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # Loki (single-binary deployment; no gateway service exists)
            - name: LOKI_URL
              value: "http://loki.logging.svc.cluster.local:3100"
            # LiteLLM
            - name: LITELLM_URL
              value: "http://litellm.ai.svc.cluster.local:8000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: litellm-api-key
                  optional: true
            # GitLab VM (internal service)
            - name: GITLAB_URL
              value: "http://gitlab-vm.gitlab.svc.cluster.local:80"
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: gitlab-token
            # Qdrant (read-only federation source for /api/projects:
            # agent tasks + pm_risks scrolled by `project` key). Same instance
            # the loom MCP servers use. Unreachable Qdrant degrades to empty +
            # partial; never blocks the response.
            - name: QDRANT_URL
              value: "http://192.168.50.176:6333"
            # API key for the loom Qdrant (it returns 401 without it). Sent as the
            # `api-key` header on every scroll. Without this, tasks/risks/decisions
            # all 401 and the page shows the partial banner.
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: qdrant-api-key
            # Langfuse (LLM observability)
            - name: LANGFUSE_URL
              value: "http://langfuse-web.ai.svc.cluster.local:3000"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: langfuse-secret-key
            # Redis (cache, pipeline trends, metrics buffering)
            - name: REDIS_URL
              value: "redis://redis.flexdeck.svc.cluster.local:6379/0"
            # Dedicated durable Redis for RBAC user persistence (separate from the
            # LRU cache above). Inert while RBAC_DISABLED=true; consumed only when
            # RBAC is enabled. See redis-rbac.yaml.
            - name: RBAC_REDIS_URL
              value: "redis://redis-rbac.flexdeck.svc.cluster.local:6379/0"
            # RBAC enablement: enforce role-based auth on the authenticated API.
            # The admin user is bootstrapped from rbac-admin-token on first run;
            # users persist in redis-rbac. Rollback = set RBAC_DISABLED back to
            # "true" (reverts to the prior open/legacy-token posture).
            - name: RBAC_DISABLED
              value: "false"
            - name: RBAC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: rbac-admin-token
            # AI namespace for FlexInfer CRDs
            - name: AI_NAMESPACE
              value: "flexinfer-system"
            # FlexInfer proxy
            - name: FLEXINFER_PROXY_URL
              value: "http://flexinfer-proxy.flexinfer-system.svc.cluster.local"
            # Grafana
            - name: GRAFANA_URL
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: grafana-token
                  optional: true
            # Alertmanager
            - name: ALERTMANAGER_URL
              value: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"
            # Loom HUD pull API (in-cluster) plus direct browser entrypoint
            - name: LOOM_HUD_URL
              value: "http://mobile-hud.loom-hub.svc.cluster.local"
            - name: LOOM_HUD_DIRECT_URL
              value: "https://hud.flexinfer.ai"
            - name: LOOM_HUD_PUSH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: hud-push-token
                  optional: true
            # Stack Explorer reads its inventory from the GitLab API
            # (GITLAB_TOKEN above), which runs in-cluster and is independent
            # of the NAS. We deliberately do NOT mount the workspace NFS
            # export here: a required `hard` NFS volume cannot mount while the
            # NAS is down, which blocks pod startup and takes the whole
            # dashboard offline (incident 2026-06-13). WORKSPACE_DIR is left
            # unset so the disk-scan fallback degrades to a graceful 503
            # ("workspace unavailable") instead of being a startup dependency.
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
