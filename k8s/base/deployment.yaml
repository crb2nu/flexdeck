apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexdeck
  namespace: flexdeck
  labels:
    app.kubernetes.io/name: flexdeck
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flexdeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexdeck
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: flexdeck
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: flexdeck
          image: registry.harbor.lan/library/flexdeck:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            # K8s - uses in-cluster config via service account
            - name: K8S_DISABLED
              value: "false"
            - name: K8S_READONLY
              value: "false"
            # Prometheus
            - name: PROM_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # Loki
            - name: LOKI_URL
              value: "http://loki-gateway.logging.svc.cluster.local:80"
            # LiteLLM
            - name: LITELLM_URL
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: litellm-api-key
                  optional: true
            # GitLab VM (internal service)
            - name: GITLAB_URL
              value: "http://gitlab-vm.gitlab.svc.cluster.local:80"
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flexdeck-secrets
                  key: gitlab-token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
