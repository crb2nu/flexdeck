stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: registry.harbor.lan/library
  IMAGE_NAME: flexdeck
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  # BuildKit configuration
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"

# Cache settings for GitLab runner cache (S3/MinIO)
.go-cache: &go-cache
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push
    when: on_success

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - web/node_modules/
    policy: pull-push
    when: on_success

# ==============================================================================
# TEST STAGE
# ==============================================================================

# Test backend (disabled: no tests exist yet)
test:backend:
  stage: test
  image: golang:${GO_VERSION}-alpine
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - apk add --no-cache git
  script:
    - go mod download
    - go vet ./...
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  rules:
    - when: never # Re-enable when tests are added

# Test frontend (typecheck only - fast)
test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run typecheck
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# BUILD STAGE
# ==============================================================================

build:
  stage: build
  image: registry.harbor.lan/library/ci-builder:latest
  variables:
    # Use GZIP for faster cache compression
    BUILDKIT_STEP_LOG_MAX_SIZE: "50000000"
  before_script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
  script:
    - |
      IMAGE="${REGISTRY}/${IMAGE_NAME}"
      # Use the shared build-cache repository
      CACHE_REPO="registry.harbor.lan/library/build-cache"

      # Common build args
      BUILD_ARGS=(
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --opt build-arg:TARGETOS=linux
        --opt build-arg:TARGETARCH=amd64
        # Registry-based cache (cross-build persistence)
        --export-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME},mode=max,image-manifest=true
        --import-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME}
      )

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        # Main branch: push SHA + latest tags
        buildctl --addr "${BUILDKIT_HOST}" build \
          "${BUILD_ARGS[@]}" \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},name=${IMAGE}:latest,push=true"
      else
        # Feature branches: SHA tag only
        buildctl --addr "${BUILDKIT_HOST}" build \
          "${BUILD_ARGS[@]}" \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},push=true"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# DEPLOY STAGE
# ==============================================================================

deploy:
  stage: deploy
  image: alpine:3.21
  before_script:
    - |
      # Bootstrap CA certificates
      if ! apk add --no-cache ca-certificates >/dev/null 2>&1; then
        sed -i 's/^https:/http:/' /etc/apk/repositories
        apk add --no-cache ca-certificates
      fi
      update-ca-certificates || true
      apk add --no-cache curl bash
    - curl -fsSL https://fluxcd.io/install.sh | bash
  script:
    - echo "Triggering Flux reconciliation..."
    - echo "Image $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA is ready for deployment"
    - flux reconcile kustomization flexdeck --with-source
    - echo "Restarting deployment to pull latest image..."
    - apk add --no-cache kubectl
    - kubectl -n flexdeck rollout restart deployment/flexdeck
    - kubectl -n flexdeck rollout status deployment/flexdeck --timeout=5m
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://deck.flexinfer.ai
