include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

stages:
  - lint
  - test
  - build
  - deploy

variables:
  REGISTRY: registry.harbor.lan/library
  IMAGE_NAME: flexdeck
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  # BuildKit configuration
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  # Work around GitLab advertising an in-cluster clone URL to runners outside the cluster.
  GIT_STRATEGY: none
  GITLAB_EXTERNAL_HOST: gitlab.flexinfer.ai

.clone_repo: &clone_repo
  - |
    set -euo pipefail
    if [ -d ".git" ] && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
      echo "Repository already present"
      exit 0
    fi
    echo "Cloning via external host ${GITLAB_EXTERNAL_HOST}..."
    git init -q .
    git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_EXTERNAL_HOST}/${CI_PROJECT_PATH}.git"
    git fetch -q --depth "${GIT_DEPTH:-20}" origin "${CI_COMMIT_SHA}"
    git checkout -q -f "${CI_COMMIT_SHA}"

.apk_add_git: &apk_add_git
  - |
    set -euo pipefail
    if command -v git >/dev/null 2>&1; then
      exit 0
    fi
    if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
      echo "Installing CA certificates..."
      sed -i 's#^https:#http:#' /etc/apk/repositories
      apk add --no-cache ca-certificates || true
      update-ca-certificates || true
      sed -i 's#^http:#https:#' /etc/apk/repositories
    fi
    for i in 1 2 3; do
      if apk add --no-cache git; then
        exit 0
      fi
      echo "apk add git failed (attempt $i/3); retrying..."
      sleep $((i * 3))
    done
    echo "Falling back to alternate Alpine mirror over HTTP..."
    sed -i 's#https://dl-cdn.alpinelinux.org#http://mirrors.edge.kernel.org#' /etc/apk/repositories
    apk add --no-cache git

# Cache settings for GitLab runner cache (S3/MinIO)
.go-cache: &go-cache
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push
    when: on_success

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - web/node_modules/
    policy: pull-push
    when: on_success

# ==============================================================================
# LINT STAGE
# ==============================================================================

lint:backend:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - go mod download
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; gofmt -d .; exit 1; fi
    - go vet ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

lint:frontend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# TEST STAGE
# ==============================================================================

# Test backend (disabled: no tests exist yet)
test:backend:
  stage: test
  image: golang:${GO_VERSION}-alpine
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - *apk_add_git
  script:
    - go mod download
    - go vet ./...
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  rules:
    - when: never # Re-enable when tests are added

# Test frontend (typecheck only - fast)
test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run typecheck
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# PERF STAGE
# ==============================================================================

perf:topology:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run perf:topology
  artifacts:
    paths:
      - web/perf/
    reports:
      performance: web/perf/performance.json
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# BUILD STAGE
# ==============================================================================

build:
  stage: build
  image: registry.harbor.lan/library/ci-builder:latest
  variables:
    # Use GZIP for faster cache compression
    BUILDKIT_STEP_LOG_MAX_SIZE: "50000000"
  before_script:
    - *clone_repo
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
  script:
    - |
      IMAGE="${REGISTRY}/${IMAGE_NAME}"
      # Use the shared build-cache repository
      CACHE_REPO="registry.harbor.lan/library/build-cache"

      # Common build args
      BUILD_ARGS=(
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --opt build-arg:TARGETOS=linux
        --opt build-arg:TARGETARCH=amd64
        # Registry-based cache (cross-build persistence)
        --export-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME},mode=max,image-manifest=true
        --import-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME}
      )

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        # Main branch: push SHA + latest tags
        buildctl --addr "${BUILDKIT_HOST}" build \
          "${BUILD_ARGS[@]}" \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},name=${IMAGE}:latest,push=true"
      else
        # Feature branches: SHA tag only
        buildctl --addr "${BUILDKIT_HOST}" build \
          "${BUILD_ARGS[@]}" \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},push=true"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# DEPLOY STAGE
# ==============================================================================

deploy:
  stage: deploy
  image: alpine:3.21
  before_script:
    - |
      # Bootstrap CA certificates
      if ! apk add --no-cache ca-certificates >/dev/null 2>&1; then
        sed -i 's/^https:/http:/' /etc/apk/repositories
        apk add --no-cache ca-certificates
      fi
      update-ca-certificates || true
      apk add --no-cache curl bash
    - curl -fsSL https://fluxcd.io/install.sh | bash
  script:
    - echo "Triggering Flux reconciliation..."
    - echo "Image $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA is ready for deployment"
    - flux reconcile kustomization apps --with-source
    - echo "Restarting deployment to pull latest image..."
    - apk add --no-cache kubectl
    - kubectl -n flexdeck rollout restart deployment/flexdeck
    - kubectl -n flexdeck rollout status deployment/flexdeck --timeout=5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://deck.flexinfer.ai
