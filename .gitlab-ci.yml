include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
stages:
  - lint
  - test
  - build
  - deploy

variables:
  REGISTRY: registry.harbor.lan/library
  IMAGE_NAME: flexdeck
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  GO_CI_IMAGE: mcr.microsoft.com/devcontainers/go:1-${GO_VERSION}-bookworm
  NODE_CI_IMAGE: mcr.microsoft.com/devcontainers/javascript-node:${NODE_VERSION}
  ALPINE_CI_IMAGE: alpine:3.21
  # BuildKit configuration
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  # Work around GitLab advertising an in-cluster clone URL to runners outside the cluster.
  GIT_STRATEGY: none
  GITLAB_EXTERNAL_HOST: gitlab.flexinfer.ai

.clone_repo: &clone_repo
  - |
    set -euo pipefail
    if [ -d ".git" ] && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
      echo "Repository already present"
      exit 0
    fi
    echo "Cloning via external host ${GITLAB_EXTERNAL_HOST}..."
    git init -q .
    git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_EXTERNAL_HOST}/${CI_PROJECT_PATH}.git"
    git fetch -q --depth "${GIT_DEPTH:-20}" origin "${CI_COMMIT_SHA}"
    git checkout -q -f "${CI_COMMIT_SHA}"

.apk_add_git: &apk_add_git
  - |
    set -euo pipefail
    if command -v git >/dev/null 2>&1; then
      exit 0
    fi
    # Always (re)install CA certificates: some base images ship a stale or
    # incomplete bundle, which can break APK index fetches with TLS errors.
    echo "Ensuring CA certificates are installed..."
    sed -i 's#^https:#http:#' /etc/apk/repositories
    apk add --no-cache ca-certificates || true
    update-ca-certificates || true
    sed -i 's#^http:#https:#' /etc/apk/repositories
    for i in 1 2 3; do
      if apk add --no-cache git; then
        exit 0
      fi
      echo "apk add git failed (attempt $i/3); retrying..."
      sleep $((i * 3))
    done
    echo "Falling back to alternate Alpine mirror over HTTP..."
    sed -i 's#https://dl-cdn.alpinelinux.org#http://mirrors.edge.kernel.org#' /etc/apk/repositories
    apk add --no-cache git

# Cache settings for GitLab runner cache (S3/MinIO)
.go-cache: &go-cache
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push
    when: on_success

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - web/node_modules/
    policy: pull-push
    when: on_success

# ==============================================================================
# LINT STAGE
# ==============================================================================

lint:backend:
  stage: lint
  image: ${GO_CI_IMAGE}
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - go mod download
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; gofmt -d .; exit 1; fi
    - go vet ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

lint:golangci:
  stage: lint
  image: ${GO_CI_IMAGE}
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - go mod download
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
    - $(go env GOPATH)/bin/golangci-lint run --timeout 5m ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

lint:frontend:
  stage: lint
  image: ${NODE_CI_IMAGE}
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# TEST STAGE
# ==============================================================================

# Test backend
test:backend:
  stage: test
  image: ${GO_CI_IMAGE}
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - go mod download
    - go vet ./...
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Test frontend (typecheck only - fast)
test:frontend:
  stage: test
  image: ${NODE_CI_IMAGE}
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run typecheck
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# PERF STAGE
# ==============================================================================

perf:topology:
  stage: test
  image: ${NODE_CI_IMAGE}
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run perf:topology
  artifacts:
    paths:
      - web/perf/
    reports:
      performance: web/perf/performance.json
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Bundle-composition guard: fails if a heavy vendor lib (three.js, yaml) regresses
# back onto a route's static import closure, or the landing page busts its JS budget.
perf:bundle:
  stage: test
  image: ${NODE_CI_IMAGE}
  <<: *node-cache
  variables:
    npm_config_registry: "http://verdaccio.ci.svc.cluster.local:4873"
  before_script:
    - *apk_add_git
    - *clone_repo
  script:
    - cd web
    - npm ci --prefer-offline
    - npm run perf:bundle
  artifacts:
    paths:
      - web/perf/bundle-budget.json
    reports:
      performance: web/perf/bundle-performance.json
    when: always
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# BUILD STAGE
# ==============================================================================

build:
  stage: build
  image: registry.harbor.lan/library/ci-builder:latest
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure
      - script_failure
  variables:
    # Use GZIP for faster cache compression
    BUILDKIT_STEP_LOG_MAX_SIZE: "50000000"
  before_script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
  script:
    - |
      IMAGE="${REGISTRY}/${IMAGE_NAME}"
      # Use the shared build-cache repository
      CACHE_REPO="registry.harbor.lan/library/build-cache"
      REMOTE_CONTEXT="https://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_EXTERNAL_HOST}/${CI_PROJECT_PATH}.git#${CI_COMMIT_SHA}"

      # Common build args
      BUILD_ARGS=(
        --frontend dockerfile.v0
        --opt context="${REMOTE_CONTEXT}"
        --opt filename=Dockerfile
        --opt build-arg:TARGETOS=linux
        --opt build-arg:TARGETARCH=amd64
        # Registry-based cache (cross-build persistence)
        --export-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME},mode=max,image-manifest=true
        --import-cache type=registry,ref=${CACHE_REPO}:${IMAGE_NAME}
      )

      build_with_retry() {
        local output_spec="$1"
        for attempt in 1 2 3; do
          echo "BuildKit build attempt ${attempt}/3..."
          if buildctl --addr "${BUILDKIT_HOST}" build \
            "${BUILD_ARGS[@]}" \
            --output "${output_spec}"; then
            return 0
          fi
          echo "buildctl failed (attempt ${attempt}/3)."
          sleep $((attempt * 3))
        done
        return 1
      }

      REF_NAME="${CI_COMMIT_BRANCH:-${CI_COMMIT_REF_NAME:-}}"

      if [ "$REF_NAME" = "main" ]; then
        # Main branch: push SHA tag first, then latest (second call hits cache instantly)
        build_with_retry "type=image,name=${IMAGE}:${CI_COMMIT_SHA},push=true"
        build_with_retry "type=image,name=${IMAGE}:latest,push=true"
      else
        # Feature branches: SHA tag only
        build_with_retry "type=image,name=${IMAGE}:${CI_COMMIT_SHA},push=true"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# DEPLOY STAGE
# ==============================================================================

deploy:
  stage: deploy
  image: ${ALPINE_CI_IMAGE}
  before_script:
    - |
      # Bootstrap CA certificates
      if ! apk add --no-cache ca-certificates >/dev/null 2>&1; then
        sed -i 's/^https:/http:/' /etc/apk/repositories
        apk add --no-cache ca-certificates
      fi
      update-ca-certificates || true
      apk add --no-cache curl bash kubectl
    - curl -fsSL https://fluxcd.io/install.sh | bash
  script:
    - export TARGET_IMAGE="$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA"
    - echo "Image $TARGET_IMAGE is ready for deployment"
    - echo "Reconfirming Flux source and apps reconciliation before the release rollout..."
    - flux reconcile source git gitops-gitlab
    - flux reconcile kustomization apps --with-source --timeout=30s || echo "Flux apps reconciliation is still progressing; flexdeck rollout already verified."
    - echo "Pinning deployment to $TARGET_IMAGE so the rollout survives Flux-managed reconciles..."
    - kubectl -n flexdeck set image deployment/flexdeck flexdeck="$TARGET_IMAGE"
    - kubectl -n flexdeck rollout status deployment/flexdeck --timeout=5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://deck.flexinfer.ai

radar-scan:
  extends: .radar-scan
