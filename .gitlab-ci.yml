stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: registry.harbor.lan/library
  IMAGE_NAME: flexdeck
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

# Cache settings
.go-cache: &go-cache
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - web/node_modules/

# Test backend
test:backend:
  stage: test
  image: golang:${GO_VERSION}-alpine
  <<: *go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOPROXY: "https://proxy.golang.org,direct"
  before_script:
    - apk add --no-cache git
  script:
    - go mod download
    - go vet ./...
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out

# Test frontend
test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node-cache
  script:
    - cd web
    - npm ci
    - npm run lint || true
    - npm run typecheck

# Build Docker image via BuildKit
build:
  stage: build
  image: registry.harbor.lan/library/ci-builder:latest
  variables:
    BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  before_script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
  script:
    - |
      IMAGE="${REGISTRY}/${IMAGE_NAME}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        # Push both SHA and latest tags for main branch
        buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},name=${IMAGE}:latest,push=true"
      else
        # Only SHA tag for non-main branches
        buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output "type=image,name=${IMAGE}:${CI_COMMIT_SHA},push=true"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Deploy to K3s via Flux
deploy:
  stage: deploy
  image: alpine:3.21
  before_script:
    - |
      # Ensure CA bundle exists so apk/curl can verify TLS.
      # If the runner environment breaks TLS verification, fall back to HTTP
      # repositories just for bootstrapping ca-certificates.
      if ! apk add --no-cache ca-certificates >/dev/null 2>&1; then
        sed -i 's/^https:/http:/' /etc/apk/repositories
        apk add --no-cache ca-certificates
      fi
      update-ca-certificates || true
      apk add --no-cache curl
    - curl -fsSL https://fluxcd.io/install.sh | sh
  script:
    - echo "Triggering Flux reconciliation..."
    # This assumes Flux is watching the gitops repo
    # The actual deployment happens via GitOps when manifests are updated
    - echo "Image $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA is ready for deployment"
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://deck.flexinfer.ai
