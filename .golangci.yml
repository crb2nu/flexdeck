# golangci-lint configuration (v2) — canonical workspace Go config (see platform/gitops
# ci/README.md). Effective linters: v2 standard set minus errcheck, plus bodyclose +
# noctx; govet `shadow` suppressed. Keep the base in sync with the fleet; the only
# per-repo delta is the scoped, issue-linked legacy exclusion below.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - noctx
  disable:
    - errcheck
  settings:
    govet:
      disable:
        - shadow
  exclusions:
    generated: lax
    rules:
      - linters: [govet]
        text: "shadows declaration"
      - path: _test\.go
        linters: [noctx, bodyclose]
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
